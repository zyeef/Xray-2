name: build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.10.2 }
      - name: Organizar arquivos
        run: |
          J=src/main/java/com/example/xray
          mkdir -p $J/mixin src/main/resources/META-INF src/main/resources/assets/xrayhelper/lang
          mv OreType.java XrayConfig.java XrayConfigScreen.java XrayMod.java XrayState.java $J/
          mv BlockMixin.java LiquidMixin.java $J/mixin/
          mv neoforge.mods.toml src/main/resources/META-INF/
          mv xrayhelper.mixins.json src/main/resources/
          mv en_us.json pt_br.json src/main/resources/assets/xrayhelper/lang/
      - run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: xrayhelper
          path: build/libs/*.jar
